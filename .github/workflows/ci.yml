name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Superseded pushes stop burning runners: a new run for the same branch
# (or PR merge ref) cancels the previous in-progress one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs (the comment after each
# `uses:` names the released tag the SHA was resolved from). Bump them
# deliberately, not implicitly with a moving tag.

jobs:
  lint:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pinned to the exact version the project formats with, so local and
      # CI results are byte-identical. Bump together with .clang-format.
      - name: Install pinned clang-format
        run: |
          python3 -m pip install --user --break-system-packages clang-format==22.1.8
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          find src tests -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.c' \) -print0 \
            | xargs -0 -r clang-format --dry-run --Werror

  core-tests:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure (core only, no FFmpeg needed)
        run: cmake -S . -B build -DFC_BUILD_APP=OFF -DFC_BUILD_MEDIA=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  core-tests-sanitize:
    # The cheapest leg in the matrix catches the most expensive bugs:
    # the dependency-free core (parsers, effects math, timeline edits)
    # runs under ASan+UBSan. Debug + frame pointers for readable traces.
    name: Core tests (ubuntu, ASan+UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure (core only, Debug + sanitizers)
        run: >
          cmake -S . -B build -DFC_BUILD_APP=OFF -DFC_BUILD_MEDIA=OFF
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  media-tests:
    name: Media tests (ubuntu, FFmpeg 6.1)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev

      - name: Configure
        run: cmake -S . -B build -DFC_BUILD_APP=OFF -DFC_BUILD_MEDIA=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  media-tests-ffmpeg44:
    # Validates the FFmpeg 4.4 code path - the API generation the Windows 7
    # build will ship with (avutil 56: pre-AVChannelLayout API).
    name: Media tests (jammy container, FFmpeg 4.4)
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 60
    steps:
      - name: Install toolchain + FFmpeg 4.4 dev
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            g++ cmake make pkg-config git ca-certificates \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev

      - name: Checkout (git >= 2.18 for actions/checkout)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure
        run: cmake -S . -B build -DFC_BUILD_APP=OFF -DFC_BUILD_MEDIA=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  media-tests-windows:
    # The media layer under MinGW64 + MSYS2 FFmpeg - the exact toolchain
    # the portable zip ships. ci.yml used to compile the FFmpeg layer on
    # Linux only, so a Windows-only break (MinGW headers, import libs,
    # path handling) surfaced only in the manual/tag-triggered portable
    # workflow, long after the commit that caused it.
    name: Media tests (windows, MinGW64 FFmpeg)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up MSYS2 (MinGW64, FFmpeg)
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          release: true
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-ffmpeg

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFC_BUILD_APP=OFF
          -DFC_BUILD_MEDIA=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  qt-app-ubuntu:
    name: Qt app build (Ubuntu, Qt 5.15)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Qt 5.15 + FFmpeg development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev pkg-config libavformat-dev libavcodec-dev \
            libavutil-dev libswscale-dev libswresample-dev ccache

      - name: Read ccache rotation month
        run: echo "CCACHE_MONTH=$(date +%Y-%m)" >> "$GITHUB_ENV"

      # The key is unique per run (the post-job save never collides with a
      # restored entry); restore-keys fall back to the newest cache saved
      # this month. Rotating the month into the prefix is what expires old
      # caches: once the calendar rolls over, nothing matches them again.
      - name: Restore ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-qt-app-ubuntu-${{ env.CCACHE_MONTH }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-qt-app-ubuntu-${{ env.CCACHE_MONTH }}-

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DFC_BUILD_APP=ON
          -DFC_BUILD_MEDIA=ON
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config Release --parallel
        env:
          CCACHE_MAXSIZE: "200M"

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release
