name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the exact version the project formats with, so local and
      # CI results are byte-identical. Bump together with .clang-format.
      - name: Install pinned clang-format
        run: |
          python3 -m pip install --user --break-system-packages clang-format==22.1.8
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          find src tests -type f \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 -r clang-format --dry-run --Werror

  core-tests:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DFC_BUILD_APP=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  qt-app-ubuntu:
    name: Qt app build (Ubuntu, Qt 5.15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 5.15 development packages
        run: sudo apt-get update && sudo apt-get install -y qtbase5-dev

      - name: Configure
        run: cmake -S . -B build -DFC_BUILD_APP=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release
