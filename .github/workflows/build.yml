name: Build & Release

# Builds a distributable Windows build of FfxTool.Gui and attaches it to a
# GitHub Release. Runs on version tags (v*) or manual dispatch.
#
# On a tag push the release description is written by the notes bot: it
# reads the commit subjects between the previous tag and this one, splits
# the repo's multi-entry commit messages (entries are joined by " and
# <type>(") so every change becomes its own bullet, and adds install
# steps plus the SHA-256 of the attached zip. GitHub's own generated
# notes (the compare link) are appended on top of that body.
#
# Note on why this is simpler than the old Python/PyInstaller build.yml:
# .NET Framework (net48) apps don't need PyInstaller-style bundling — a
# normal `dotnet build` in Release config already produces a runnable
# FfxTool.Gui.exe plus its dependency DLLs and data/plugin_table.json in
# the output folder (copied there via the csproj's CopyToOutputDirectory
# settings). We just zip that folder as-is.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    # windows-latest specifically: has the .NET Framework 4.8 targeting
    # pack pre-installed, required to build net48 projects at all.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the notes bot walks the history between the previous tag and
          # this one — a shallow clone would have nothing to read
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        # FfxTool.sln now includes FfxTool.Gui — single restore covers all projects
        run: dotnet restore FfxTool.sln

      - name: Run tests before packaging
        run: dotnet test FfxTool.sln --configuration Release

      - name: Build (Release)
        # Build via the solution so Core + Gui share the same Release output handling
        run: dotnet build FfxTool.sln --configuration Release --no-restore

      - name: Locate build output
        id: locate
        shell: pwsh
        run: |
          $outDir = Get-ChildItem -Path "FfxTool.Gui\bin\Release" -Recurse -Filter "FfxTool.Gui.exe" |
            Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $outDir) { throw "Could not find FfxTool.Gui.exe under FfxTool.Gui\bin\Release" }
          echo "outdir=$outDir" >> $env:GITHUB_OUTPUT

      - name: Zip build output
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ steps.locate.outputs.outdir }}\*" -DestinationPath "FFXCompatibilityTool-windows.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFXCompatibilityTool-windows
          path: FFXCompatibilityTool-windows.zip

      - name: Generate the release description
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          # nearest tag reachable from the new tag's parent commit — empty
          # when this is the first tag ever (then the range is the whole
          # history, which is honest for a first release)
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          RANGE="$TAG"
          if [ -n "$PREV" ]; then RANGE="${PREV}..${TAG}"; fi
          SUM="$(sha256sum FFXCompatibilityTool-windows.zip | cut -d' ' -f1)"
          {
            echo "FFX Compatibility Tool ${TAG} — the portable Windows build."
            echo ""
            echo "## What's changed"
            echo ""
            git log "$RANGE" --format='%s' \
              | sed -E 's/ and (chore|feat|fix|ci|docs|test|build|refactor|perf)\(/\n\1(/g' \
              | sed 's/^/- /' > release_commits.txt
            if [ -s release_commits.txt ]; then
              cat release_commits.txt
            else
              echo "- (no commit notes could be read for this range)"
            fi
            echo ""
            echo "## Install"
            echo ""
            echo "1. Download **FFXCompatibilityTool-windows.zip** below and unzip it anywhere."
            echo "2. Run **FfxTool.Gui.exe** — no installer."
            echo "3. Requires .NET Framework 4.8 (preinstalled on Windows 10/11; Windows 7 SP1 needs the 4.8 runtime installed once)."
            echo ""
            echo "## Verify"
            echo ""
            echo '```'
            echo "SHA-256  ${SUM}  FFXCompatibilityTool-windows.zip"
            echo '```'
            echo ""
            echo "The in-app **Check for Updates** (Settings → About) compares against VERSION.txt on the default branch — bump that one-line file in the same commit as the code it announces."
          } > release_notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: FFX Compatibility Tool ${{ github.ref_name }}
          body_path: release_notes.md
          files: FFXCompatibilityTool-windows.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
