name: Portable Build

# Produces a self-contained Windows x64 portable zip (FusionCutPro.exe +
# all runtime DLLs in one folder - no installer, no registry writes).
#   - Manual:  Actions tab -> Portable Build -> Run workflow
#   - Release: pushing a tag named v* attaches the zip to a GitHub Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows-portable:
    name: Windows x64 portable zip
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write # required to attach artifacts to releases (tags only)
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW64, Qt 5.15, FFmpeg)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: true
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-ffmpeg

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFC_BUILD_APP=ON
          -DFC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run core tests
        run: ctest --test-dir build --output-on-failure

      - name: Stage portable tree
        run: |
          cmake --install build --prefix "$PWD/dist"
          # Manual Qt deployment. No qmake / windeployqt assumptions:
          # locate the platform plugin itself and derive the plugin root
          # from its physical location (qwindows.dll sits in
          # <plugins>/platforms/). Qt resolves <appdir>/platforms/... at
          # runtime because the executable directory is a library path.
          # NOTE: this shell runs under bash -leo pipefail (msys2.CMD), so
          # every pipeline whose grep/find can "legitimately" find nothing
          # is guarded with || true, and find uses -print -quit instead of
          # a head pipe.
          QWINDOWS="$(find /mingw64 -name 'qwindows.dll' -print -quit 2>/dev/null)"
          if [ -z "$QWINDOWS" ]; then
            echo "::error::qwindows.dll not found under /mingw64 (Qt install incomplete?)"
            exit 1
          fi
          PLUGIN_DIR="$(cd "$(dirname "$QWINDOWS")/.." && pwd)"
          echo "Qt plugin root: $PLUGIN_DIR"
          # Copy each plugin category both into dist/<cat>/ (the layout Qt
          # searches via the app directory) AND into dist/plugins/<cat>/
          # (the canonical layout qt.conf below points at). Redundant on
          # purpose - resolves the "platform plugin failed to initialize"
          # crash on machines without MSYS2's absolute plugin path.
          mkdir -p dist/plugins
          for p in platforms styles imageformats iconengines; do
            if [ -d "$PLUGIN_DIR/$p" ]; then
              mkdir -p "dist/$p" "dist/plugins/$p"
              cp -f "$PLUGIN_DIR/$p"/*.dll "dist/$p/" || true
              cp -f "$PLUGIN_DIR/$p"/*.dll "dist/plugins/$p/" || true
            fi
          done
          # Defensive: plugins sometimes fail to resolve their own Qt DLL
          # deps when the loader searches the plugin dir first; mirror the
          # core Qt DLLs next to each plugin category.
          for q in Qt5Core Qt5Gui Qt5Widgets Qt5OpenGL; do
            [ -f "/mingw64/bin/$q.dll" ] || continue
            for d in dist/platforms dist/plugins/platforms dist/imageformats \
                     dist/plugins/imageformats dist/styles dist/plugins/styles; do
              [ -d "$d" ] && cp -n "/mingw64/bin/$q.dll" "$d/" 2>/dev/null || true
            done
          done
          # qt.conf pins the install root so Qt does not chase the MSYS2
          # absolute plugin path baked into the runtime libraries.
          printf '%s\n' '[Paths]' 'Prefix = .' 'Plugins = plugins' 'Binaries = .' > dist/qt.conf
          # Iterative ldd sweep: copy every MinGW64 DLL needed by the app,
          # its plugins, and each other (Qt, FFmpeg, MinGW runtimes).
          # The trailing || true is required: plugins that link only
          # Windows system DLLs make grep exit 1, which under pipefail
          # would otherwise abort the whole job.
          #
          # fcp-loader-check.exe is intentionally excluded from this
          # sweep (it is built -static, so ldd returns zero /mingw64/
          # deps - that is correct, not a missing-sweep bug). The tool
          # must remain dependency-free so it can run on a broken
          # install where the very DLLs this sweep bundles are missing.
          # The api-ms-win-core-synch-l1-2-0.dll forwarder stub is also
          # expected to show zero /mingw64/ deps here: it is built with
          # -nostdlib and contains only forwarder export entries.
          for pass in 1 2 3; do
            for bin in dist/*.exe dist/*.dll dist/*/*.dll dist/plugins/*/*.dll; do
              [ -f "$bin" ] || continue
              ldd "$bin" 2>/dev/null | grep '/mingw64/' | awk '{print $3}' | \
                while read -r dll; do cp -n "$dll" dist/ 2>/dev/null || true; done \
                || true
            done
          done
          # --- Windows 8.x api-set forwarder stub (v0.4.6) ------------------
          # Root cause of the startup 0xc0000005 on the user's machine
          # (diagnosed by fcp-loader-check.exe v2's debug-launch watch):
          # librav1e.dll (Rust, in avcodec's dependency tree) hard-imports
          # 'api-ms-win-core-synch-l1-2-0.dll' (WaitOnAddress futex set).
          # The Win8.x loader cannot schema-resolve that name, maps the
          # System32 placeholder stub, and faults reading its invalid
          # export data inside ntdll's import-snapping code - before any
          # user code runs, so WER never engages (no Event Viewer entry,
          # no crash log; only the bare "unable to start correctly"
          # dialog). On Win10/11 the ApiSetSchema resolves the name
          # before the file search and the fault never happens.
          # The DLL search order tries the application directory BEFORE
          # System32, so this forwarder-only DLL (valid export table
          # forwarding to the KernelBase implementations, no code, no
          # imports, no CRT) wins the bind on Win8.x and is inert on
          # Win10/11. See packaging/api-ms-win-core-synch-l1-2-0.def.
          gcc -shared -nostdlib \
              -o dist/api-ms-win-core-synch-l1-2-0.dll \
              packaging/api-ms-win-core-synch-l1-2-0.def
          if [ ! -s dist/api-ms-win-core-synch-l1-2-0.dll ]; then
            echo "::error::api-set forwarder stub was not created"
            exit 1
          fi
          # CI-side verification of the .def -> DLL pipeline (the build
          # sandbox has no PE toolchain): the stub must actually export
          # the forwarders. Blocks the job if the .def/linker contract
          # ever breaks instead of shipping a broken stub silently.
          if ! objdump -p dist/api-ms-win-core-synch-l1-2-0.dll | \
               grep -q 'WaitOnAddress'; then
            echo "::error::api-set forwarder stub lacks the WaitOnAddress export"
            objdump -p dist/api-ms-win-core-synch-l1-2-0.dll || true
            exit 1
          fi
          cp VERSION dist/VERSION.txt
          printf '%s\n' \
            'FusionCut Pro - portable build (v0.4.6)' '' \
            'Double-click FusionCutPro.exe to launch.' '' \
            'IF FUSIONCUTPRO.EXE WILL NOT START (the Windows dialog says' \
            '"The application was unable to start correctly' \
            '(0xc0000005)" and no log appears in crash-logs/):' \
            '  -> Double-click fcp-loader-check.exe.' \
            '  -> PHASE 1: it walks the PE import tree from OUTSIDE the' \
            '     process and names any DLL the loader cannot map.' \
            '  -> PHASE 2: it then launches FusionCutPro.exe UNDER A' \
            '     DEBUG WATCH (a built-in mini-debugger) and records' \
            '     every DLL as it loads and every exception as it is' \
            '     raised - including faults inside DllMain / static' \
            '     initializers that Windows Error Reporting NEVER sees' \
            '     (which is why Event Viewer shows nothing for the app).' \
            '     The tool names the faulting module and offset.' \
            '     The app may open a window briefly - that is the' \
            '     watch confirming startup; it closes it after 25 s.' \
            '  -> A MessageBox summarizes the result; the full module' \
            '     load trail + exception list is written to' \
            '     loader-check-<timestamp>.log next to this exe (or in' \
            '     %TEMP% if this folder is read-only).' \
            '  -> Send that log to the developer - the VERDICT section' \
            '     names the crashing module, or the last DLLs that were' \
            '     loading when the process died.' \
            '' \
            'That class of crash is the Windows loader-phase failure' \
            '(import-resolution / DllMain / CRT-init), which runs BEFORE' \
            'any user code in FusionCutPro.exe - so the in-process crash' \
            'handler cannot see it and no crash-logs/ entry is produced.' \
            'fcp-loader-check.exe is the diagnostic for that class.' '' \
            'NOTE (v0.4.6): the bundled api-ms-win-core-synch-l1-2-0.dll' \
            'next to FusionCutPro.exe is REQUIRED on Windows 8.x - it' \
            'fixes a loader crash with FFmpeg 8\'s rav1e encoder DLL.' \
            'Leave it in place. On Windows 10/11 it is ignored.' '' \
            'IF FUSIONCUTPRO.EXE STARTS BUT THEN CRASHES at runtime, a' \
            'detailed crash log is written to crash-logs/ next to the' \
            'executable (FusionCutPro-crash-<timestamp>.log) with the' \
            'exception kind, stack backtrace, and loaded-module list. On' \
            'Windows a dialog box also names the log file path. Send the' \
            'crash log file to the developer so the cause can be fixed.' '' \
            'Smoke tests:' \
            '  FusionCutPro.exe --crash-test' \
            '    Writes a synthetic runtime crash report and exits without' \
            '    starting the UI. Verifies the crash-report pipeline.' \
            '  fcp-loader-check.exe' \
            '    Phase 1 maps the import tree without running any DLL' \
            '    DllMain; phase 2 launches the app under a debug watch.' \
            '    Verifies the install is dependency-complete AND startup' \
            '    is fault-free.' \
            > dist/PORTABLE.txt
          # Crash log directory. The in-process handler never creates
          # directories itself (it runs in exception context and must not
          # touch filesystem structure beyond opening a single file). Pre-
          # create the dir here so a fresh portable install has somewhere
          # to land the first report.
          mkdir -p dist/crash-logs
          ls dist | wc -l
          ls dist

      - name: Package portable zip
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $zip = "FusionCutPro-$version-win64-portable.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip -Force
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Packaged $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
