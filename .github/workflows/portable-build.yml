name: Portable Build

# Produces a self-contained Windows x64 portable zip (FusionCutPro.exe +
# all runtime DLLs in one folder - no installer, no registry writes).
#   - Manual:  Actions tab -> Portable Build -> Run workflow
#   - Release: pushing a tag named v* attaches the zip to a GitHub Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows-portable:
    name: Windows x64 portable zip
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write # required to attach artifacts to releases (tags only)
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW64, Qt 5.15, FFmpeg)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: true
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-ffmpeg

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFC_BUILD_APP=ON
          -DFC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run core tests
        run: ctest --test-dir build --output-on-failure

      - name: Stage portable tree
        run: |
          cmake --install build --prefix "$PWD/dist"
          # Manual Qt deployment. No qmake / windeployqt assumptions:
          # locate the platform plugin itself and derive the plugin root
          # from its physical location (qwindows.dll sits in
          # <plugins>/platforms/). Qt resolves <appdir>/platforms/... at
          # runtime because the executable directory is a library path.
          # NOTE: this shell runs under bash -leo pipefail (msys2.CMD), so
          # every pipeline whose grep/find can "legitimately" find nothing
          # is guarded with || true, and find uses -print -quit instead of
          # a head pipe.
          QWINDOWS="$(find /mingw64 -name 'qwindows.dll' -print -quit 2>/dev/null)"
          if [ -z "$QWINDOWS" ]; then
            echo "::error::qwindows.dll not found under /mingw64 (Qt install incomplete?)"
            exit 1
          fi
          PLUGIN_DIR="$(cd "$(dirname "$QWINDOWS")/.." && pwd)"
          echo "Qt plugin root: $PLUGIN_DIR"
          # Copy each plugin category both into dist/<cat>/ (the layout Qt
          # searches via the app directory) AND into dist/plugins/<cat>/
          # (the canonical layout qt.conf below points at). Redundant on
          # purpose - resolves the "platform plugin failed to initialize"
          # crash on machines without MSYS2's absolute plugin path.
          mkdir -p dist/plugins
          for p in platforms styles imageformats iconengines; do
            if [ -d "$PLUGIN_DIR/$p" ]; then
              mkdir -p "dist/$p" "dist/plugins/$p"
              cp -f "$PLUGIN_DIR/$p"/*.dll "dist/$p/" || true
              cp -f "$PLUGIN_DIR/$p"/*.dll "dist/plugins/$p/" || true
            fi
          done
          # Defensive: plugins sometimes fail to resolve their own Qt DLL
          # deps when the loader searches the plugin dir first; mirror the
          # core Qt DLLs next to each plugin category.
          for q in Qt5Core Qt5Gui Qt5Widgets Qt5OpenGL; do
            [ -f "/mingw64/bin/$q.dll" ] || continue
            for d in dist/platforms dist/plugins/platforms dist/imageformats \
                     dist/plugins/imageformats dist/styles dist/plugins/styles; do
              [ -d "$d" ] && cp -n "/mingw64/bin/$q.dll" "$d/" 2>/dev/null || true
            done
          done
          # qt.conf pins the install root so Qt does not chase the MSYS2
          # absolute plugin path baked into the runtime libraries.
          printf '%s\n' '[Paths]' 'Prefix = .' 'Plugins = plugins' 'Binaries = .' > dist/qt.conf
          # Iterative ldd sweep: copy every MinGW64 DLL needed by the app,
          # its plugins, and each other (Qt, FFmpeg, MinGW runtimes).
          # The trailing || true is required: plugins that link only
          # Windows system DLLs make grep exit 1, which under pipefail
          # would otherwise abort the whole job.
          #
          # fcp-loader-check.exe is intentionally excluded from this
          # sweep (it is built -static, so ldd returns zero /mingw64/
          # deps - that is correct, not a missing-sweep bug). The tool
          # must remain dependency-free so it can run on a broken
          # install where the very DLLs this sweep bundles are missing.
          # The api-ms-win-core-synch-l1-2-0.dll shim is likewise
          # expected to show zero /mingw64/ deps here: it is built by
          # CMake (-nostdlib) and imports kernel32 only.
          for pass in 1 2 3; do
            for bin in dist/*.exe dist/*.dll dist/*/*.dll dist/plugins/*/*.dll; do
              [ -f "$bin" ] || continue
              ldd "$bin" 2>/dev/null | grep '/mingw64/' | awk '{print $3}' | \
                while read -r dll; do cp -n "$dll" dist/ 2>/dev/null || true; done \
                || true
            done
          done
          # --- librsvg-2-2.dll stub (v0.4.11): Win7 entry-point fix, take 3 ---------
          # v0.4.8 field report (Windows 7 machine): the load trail showed the
          # api-set shim binding (module 59: our api-ms-win-core-synch-l1-2-0.dll
          # via librav1e.dll) and then died with STATUS_ENTRYPOINT_NOT_FOUND
          # (0xc0000139): the Windows dialog named kernel32!
          # GetSystemTimePreciseAsFileTime, a Windows 8+ export. The importer is
          # the bundled librsvg-2-2.dll - its Rust core statically imports the
          # Win8+ time function (modern Rust targets Windows 10+). librsvg is in
          # the tree only because MSYS2 FFmpeg enables the SVG decoder, which
          # FusionCut Pro never uses. KERNEL32 is a KnownDLL: no app-dir DLL can
          # ever supply its exports, so the api-set shim technique cannot apply.
          # Instead: REPLACE the bundled librsvg-2-2.dll with a stub that exports
          # EXACTLY the symbols avcodec-62.dll imports (extracted from its real
          # import table here - no hand-maintained list to drift), every one a
          # function that returns 0. avcodec then loads on Windows 7; the SVG
          # decoder fails gracefully if ever invoked (video and audio codecs are
          # unaffected); and the whole librsvg DLL subtree (pango, gio, xml2, ...)
          # stops loading - those files stay in dist as inert dead weight, their
          # Win7 risk pool removed from the launch path.
          #
          # v0.4.10 CHANGE - the v0.4.9 CI run of this step died in ld:
          #   build/librsvg_stub.def:6: syntax error
          #   build/librsvg_stub.def: file format not recognized; treating as
          #   linker script ... :1: syntax error
          # v0.4.9 generated a module definition (.def) file and passed it to
          # gcc -shared, which made the build depend on the binutils
          # module-definition grammar - an implementation detail, and evidently
          # not tolerant of what this run fed it (the v0.4.9 log printed only a
          # symbol COUNT, so the offending def line was never even visible).
          # Take 2 removes the .def file entirely:
          #   - the stub C source declares one __declspec(dllexport) function
          #     per imported symbol (the documented MinGW export mechanism; the
          #     loader binds each import by name, so each export name matches);
          #   - every extracted token is validated as a C identifier BEFORE
          #     code generation: objdump placeholder rows that carry no real
          #     name (tokens like (0) / (BAD) / <unknown>, which objdump prints
          #     for unresolvable or terminator rows) are warn-skipped; anything
          #     else non-identifier fails the build NAMING the token and
          #     dumping the import section - an ld syntax error three layers
          #     away is not a debuggable message;
          #   - the awk extractor additionally stops at objdump section
          #     headers, so nothing printed after the import table can leak
          #     into the symbol list;
          #   - the full symbol list is echoed to the log.
          #
          # v0.4.11 CHANGE - the v0.4.10 CI run died in the take-2 identifier
          # validation with token [01a0c838] - which is not an import name at
          # all. The error path dumped the librsvg import section, and the dump
          # finally shows the REAL MSYS2 objdump format: after each DLL import
          # section objdump prints that DLL import-DESCRIPTOR line - space
          # indented, six hex fields (descriptor vma, INT RVA, timestamp,
          # forwarder chain, name RVA, first-thunk RVA). Its LAST field is the
          # vma of the NEXT DLL first import row (01a0c838 - the address of
          # speex_bits_destroy, visible as exactly that two lines later in the
          # same dump). The take-2 filter accepted ANY line with a hex first
          # field and 3+ fields and printed its last field, so the descriptor
          # line leaked that address into the symbol list; the identifier
          # validation then correctly refused it and failed the build NAMING it
          # (the safety net held - one layer earlier than in v0.4.9). The same
          # leak is also the REAL author of the v0.4.9 def:6 syntax error: def
          # line 6 was the hex token, which the binutils def grammar rejects
          # (the take-2 placeholder-row hypothesis was wrong - the sandbox mock
          # transcripts had been authored from a REMEMBERED objdump format that
          # never shows descriptor lines; the mocks are now rebuilt from this
          # real CI dump. Lesson: never author a mock from memory - capture the
          # real transcript from the failure log). Take 3 accepts ONLY rows
          # shaped like a by-name import row - hex vma, <none> ordinal column,
          # hex hint, then the name - and prints the Member-Name column ($4,
          # not $NF), so neither a descriptor line nor a filled Bound-To column
          # can masquerade as a symbol. The tripwire awk further below gets the
          # same row shape (its leaked hex tokens could never have matched the
          # name blocklist, so its verdicts were already right - the noise is
          # gone and both parsers now share one format contract).
          rsvg_syms="$(objdump -p dist/avcodec-62.dll | awk '
            $1 == "DLL" && $2 == "Name:" { inrsvg = ($3 ~ /^librsvg/); next }
            /^(The |PE |There |Sections:)/ { inrsvg = 0; next }
            inrsvg && NF >= 4 && $1 ~ /^[0-9a-f]+$/ && $2 == "<none>" && $3 ~ /^[0-9a-f]+$/ { print $4 }
          ')"
          if [ -z "$rsvg_syms" ]; then
            echo "::error::no librsvg imports found in dist/avcodec-62.dll (import table format change? ordinal imports?)"
            objdump -p dist/avcodec-62.dll | sed -n '/DLL Name: *librsvg/,/^The /p' | head -40 || true
            exit 1
          fi
          # Deduplicate: a repeated IAT entry would emit two C definitions of
          # the same function and fail the compile.
          rsvg_syms="$(printf '%s\n' "$rsvg_syms" | LC_ALL=C sort -u)"
          kept=""
          placeholders=""
          bad=""
          for s in $rsvg_syms; do
            case "$s" in
              "("*|"<"*)
                placeholders="$placeholders $s"
                ;;
              *)
                if [[ "$s" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
                  kept="$kept $s"
                else
                  bad="$bad [$s]"
                fi
                ;;
            esac
          done
          if [ -n "$placeholders" ]; then
            echo "::warning::librsvg import list: skipping objdump placeholder token(s):$placeholders (not import names)"
          fi
          if [ -n "$bad" ]; then
            echo "::error::librsvg import extraction produced non-identifier token(s):$bad"
            objdump -p dist/avcodec-62.dll | sed -n '/DLL Name: *librsvg/,/^The /p' | head -40 || true
            exit 1
          fi
          if [ -z "$kept" ]; then
            echo "::error::librsvg import list contained only placeholder tokens - no exportable symbols"
            exit 1
          fi
          rsvg_syms="$kept"
          echo "librsvg stub: exporting $(printf '%s\n' $rsvg_syms | wc -l) symbol(s) for avcodec:"
          printf '  %s\n' $rsvg_syms
          {
            echo '/* generated by CI (v0.4.11) - librsvg-2-2.dll Windows 7 stub */'
            echo '/* one exported function per avcodec-62.dll import; returns 0 */'
            for s in $rsvg_syms; do
              echo "__declspec(dllexport) long $s(void) { return 0; }"
            done
          } > build/librsvg_stub.c
          gcc -c build/librsvg_stub.c -o build/librsvg_stub.o
          gcc -shared build/librsvg_stub.o -o dist/librsvg-2-2.dll
          # The stub links the default MinGW CRT (kernel32 + msvcrt, both
          # Win7-era); sweep it for completeness like every other dist binary
          # (guarded per the pipefail rule above).
          ldd dist/librsvg-2-2.dll 2>/dev/null | grep '/mingw64/' | awk '{print $3}' | \
            while read -r dll; do cp -n "$dll" dist/ 2>/dev/null || true; done \
            || true
          # Blocking: every symbol avcodec imports must appear in the stub
          # export table. Export names are anchored at end-of-line and preceded
          # by whitespace (the same EOL technique as the api-set check below; a
          # longer export that merely CONTAINS the symbol can never satisfy the
          # check, and [[:space:]] covers every export-row separator objdump
          # prints - spaces or a tab).
          missing=""
          for s in $rsvg_syms; do
            if ! objdump -p dist/librsvg-2-2.dll | grep -q "[[:space:]]${s}\$"; then
              missing="$missing $s"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::librsvg stub is missing export(s):$missing"
            objdump -p dist/librsvg-2-2.dll | sed -n '/Export Tables/,$p' | head -40 || true
            exit 1
          fi
          # --- Windows 7 import tripwire (v0.4.9) --------------------------------
          # Blocklist of kernel32/KERNELBASE exports introduced after Windows 7
          # that MSYS2-built binaries are known to import (Rust std, modern glib,
          # current runtimes). NOT a complete Win7 API oracle: it is a tripwire
          # that names the next Win7-incompatible import here in CI instead of on
          # the user machine. If it fires: add the function to this list, then
          # stub or patch the importer exactly like the librsvg step above.
          # v0.4.11: the import-list awk now uses the same by-name row shape as
          # the librsvg extractor (hex vma / <none> / hex hint / name) - the old
          # loose filter also ingested descriptor-line tails here (harmless hex
          # noise that could never match a blocklist NAME, but gone is better).
          blocklist="GetSystemTimePreciseAsFileTime GetCurrentThreadStackLimits QueryInterruptTime QueryInterruptTimePrecise SetThreadDescription GetSystemCpuSetInformation"
          tripwire_hit=""
          for bin in dist/*.exe dist/*.dll dist/*/*.dll dist/plugins/*/*.dll; do
            [ -f "$bin" ] || continue
            binimports="$(objdump -p "$bin" 2>/dev/null | awk '
              $1 == "DLL" && $2 == "Name:" { insys = ($3 ~ /^[Kk][Ee][Rr][Nn][Ee][Ll]/); next }
              insys && NF >= 4 && $1 ~ /^[0-9a-f]+$/ && $2 == "<none>" && $3 ~ /^[0-9a-f]+$/ { print $4 }
            ' | tr '\n' ' ')"
            for bad in $blocklist; do
              case " $binimports " in
                *" $bad "*)
                  echo "::error::$bin imports $bad (Windows 8/10+; absent on Windows 7)"
                  tripwire_hit=1
                  ;;
              esac
            done
          done
          if [ -n "$tripwire_hit" ]; then
            echo "Windows 7 import tripwire fired - see the annotations above."
            exit 1
          fi

          # --- api-set shim export verification (v0.4.7) --------------------
          # dist/api-ms-win-core-synch-l1-2-0.dll is now built by CMake
          # (target fcp-apiset-synch, src/app/api_set_synch.c) and
          # installed by the cmake --install above - the v0.4.6
          # packaging/*.def + inline gcc -shared build is gone. The DLL
          # carries REAL implementations of the WaitOnAddress futex set
          # (not forwarders: KernelBase only implements it since
          # Windows 8, and the user's test platform is Windows 7), so
          # the loader-phase 0xc0000005 is fixed on Win7 AND Win8.x;
          # on Win10/11 the ApiSetSchema wins and the file is inert.
          # The export names are anchored at end-of-line so an import
          # like SleepConditionVariableSRW can never satisfy the check.
          for sym in Sleep WaitOnAddress WakeByAddressAll \
                     WakeByAddressSingle; do
            if ! objdump -p dist/api-ms-win-core-synch-l1-2-0.dll | \
                 grep -q "${sym}$"; then
              echo "::error::api-set shim lacks the ${sym} export"
              objdump -p dist/api-ms-win-core-synch-l1-2-0.dll || true
              exit 1
            fi
          done
          cp VERSION dist/VERSION.txt
          # PORTABLE.txt prose. RULE (learned the hard way in the v0.4.6
          # CI run): no apostrophes inside these single-quoted arguments.
          # In bash, \' inside '...' does NOT escape the quote - it
          # TERMINATES the string (FFmpeg 8\'s flipped the quote parity
          # of the whole printf; the first later "(" that landed outside
          # quotes then killed the script with "syntax error near
          # unexpected token (" at line 138). Write possessives as
          # "the DLL that ships with FFmpeg 8" instead.
          printf '%s\n' \
            'FusionCut Pro - portable build (v0.4.11)' '' \
            'Double-click FusionCutPro.exe to launch.' '' \
            'IF FUSIONCUTPRO.EXE WILL NOT START (the Windows dialog says' \
            '"The application was unable to start correctly' \
            '(0xc0000005)" and no log appears in crash-logs/):' \
            '  -> Double-click fcp-loader-check.exe.' \
            '  -> PHASE 1: it walks the PE import tree from OUTSIDE the' \
            '     process and names any DLL the loader cannot map.' \
            '  -> PHASE 2: it then launches FusionCutPro.exe UNDER A' \
            '     DEBUG WATCH (a built-in mini-debugger) and records' \
            '     every DLL as it loads and every exception as it is' \
            '     raised - including faults inside DllMain / static' \
            '     initializers that Windows Error Reporting NEVER sees' \
            '     (which is why Event Viewer shows nothing for the app).' \
            '     The tool names the faulting module and offset.' \
            '     The app may open a window briefly - that is the' \
            '     watch confirming startup; it closes it after 25 s.' \
            '  -> A MessageBox summarizes the result; the full module' \
            '     load trail + exception list is written to' \
            '     loader-check-<timestamp>.log next to this exe (or in' \
            '     %TEMP% if this folder is read-only).' \
            '  -> Send that log to the developer - the VERDICT section' \
            '     names the crashing module, or the last DLLs that were' \
            '     loading when the process died.' \
            '' \
            'That class of crash is the Windows loader-phase failure' \
            '(import-resolution / DllMain / CRT-init), which runs BEFORE' \
            'any user code in FusionCutPro.exe - so the in-process crash' \
            'handler cannot see it and no crash-logs/ entry is produced.' \
            'fcp-loader-check.exe is the diagnostic for that class.' '' \
            'NOTE (v0.4.11): the api-ms-win-core-synch-l1-2-0.dll file' \
            'next to FusionCutPro.exe is REQUIRED on Windows 7 and' \
            'Windows 8.x - it fixes the startup crash caused by the' \
            'rav1e encoder DLL that ships with FFmpeg 8 (it imports' \
            'the WaitOnAddress futex API set, which does not exist on' \
            'those Windows versions; the bundled file provides a' \
            'compatible real implementation). Leave it in place. On' \
            'Windows 10/11 the file is ignored.' '' \
            'ALSO NOTE (v0.4.11): the librsvg-2-2.dll file next to' \
            'FusionCutPro.exe is a small stub (its functions return' \
            'failure) so the app can start on Windows 7 - the real' \
            'librsvg from the FFmpeg stack requires Windows 8 or newer' \
            '(SVG image decoding is therefore unavailable; video and' \
            'audio codecs are unaffected). Several dormant DLL files' \
            'beside it belong to the real librsvg family; they are' \
            'inert (nothing loads them) - leave them in place.' '' \
            'IF FUSIONCUTPRO.EXE STARTS BUT THEN CRASHES at runtime, a' \
            'detailed crash log is written to crash-logs/ next to the' \
            'executable (FusionCutPro-crash-<timestamp>.log) with the' \
            'exception kind, stack backtrace, and loaded-module list. On' \
            'Windows a dialog box also names the log file path. Send the' \
            'crash log file to the developer so the cause can be fixed.' '' \
            'Smoke tests:' \
            '  FusionCutPro.exe --crash-test' \
            '    Writes a synthetic runtime crash report and exits without' \
            '    starting the UI. Verifies the crash-report pipeline.' \
            '  fcp-loader-check.exe' \
            '    Phase 1 maps the import tree without running any DLL' \
            '    DllMain; phase 2 launches the app under a debug watch.' \
            '    Verifies the install is dependency-complete AND startup' \
            '    is fault-free.' \
            > dist/PORTABLE.txt
          # Crash log directory. The in-process handler never creates
          # directories itself (it runs in exception context and must not
          # touch filesystem structure beyond opening a single file). Pre-
          # create the dir here so a fresh portable install has somewhere
          # to land the first report.
          mkdir -p dist/crash-logs
          ls dist | wc -l
          ls dist

      - name: Package portable zip
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $zip = "FusionCutPro-$version-win64-portable.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip -Force
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Packaged $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
